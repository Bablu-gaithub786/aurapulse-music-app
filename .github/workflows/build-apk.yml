name: Build Native Android APK (Capacitor)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Configure Android SDK Location & Accept Licenses
        run: |
          mkdir -p android
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          mkdir -p /usr/local/lib/android/sdk/licenses || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a532e303d725e8b5933b4d7702c\n" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          if [ -d "$ANDROID_HOME/platforms/android-36.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            ln -s "$ANDROID_HOME/platforms/android-36.0" "$ANDROID_HOME/platforms/android-36"
          fi
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android APK (assembleDebug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/*.apk output-apk/AuraPulse.apk
          echo "APK generated successfully:"
          ls -la output-apk/

      - name: Upload APK Artifact (ZIP contains AuraPulse.apk)
        uses: actions/upload-artifact@v4
        with:
          name: AuraPulse-Android-APK
          path: output-apk/AuraPulse.apk
          retention-days: 14

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: v1.0.0-apk
          name: "AuraPulse Android App (Latest APK)"
          body: "Direct Android APK download for AuraPulse Music Visualizer. Download the AuraPulse.apk file directly to your phone and install."
          files: output-apk/AuraPulse.apk
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
