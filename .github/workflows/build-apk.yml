name: Build Native Android APK (Capacitor)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Build Android APK (assembleDebug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/*.apk output-apk/AuraPulse.apk
          echo "APK generated successfully:"
          ls -la output-apk/

      - name: Upload APK Artifact (ZIP contains AuraPulse.apk)
        uses: actions/upload-artifact@v4
        with:
          name: AuraPulse-Android-APK
          path: output-apk/AuraPulse.apk
          retention-days: 14

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-apk
          name: "AuraPulse Android App (Latest APK)"
          body: "Direct Android APK download for AuraPulse Music Visualizer. Download the AuraPulse.apk file directly to your phone and install."
          files: output-apk/AuraPulse.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
